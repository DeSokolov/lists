name: iosApp

options:
  bundleIdPrefix: com.desokolov
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configuration/Config.xcconfig
  Release: Configuration/Config.xcconfig

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.desokolov.lists
        PRODUCT_NAME: Lists
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: $(TEAM_ID)
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.desokolov.lists"
        CODE_SIGN_IDENTITY: "Apple Distribution"
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        ENABLE_USER_SCRIPT_SANDBOXING: $(inherited) NO
        CADisableMinimumFrameDurationOnPhone: true
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleName: Lists
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
    postCompileScripts:
      - script: |
          if [ -e "${PODS_ROOT}/FirebaseCrashlytics/run" ] && [ -e "${SRCROOT}/iosApp/GoogleService-Info.plist" ]; then
            "${PODS_ROOT}/FirebaseCrashlytics/run" -gsp "${SRCROOT}/iosApp/GoogleService-Info.plist"
          fi
        name: "Upload dSYM to Crashlytics"
        basedOnDependencyAnalysis: false
        inputFiles:
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}"
          - "$(SRCROOT)/$(BUILT_PRODUCTS_DIR)/$(INFOPLIST_PATH)"

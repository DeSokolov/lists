<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Settings v4</title>
<style>
  body {
    background: #e0dce8;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 30px 20px;
    font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif;
    gap: 36px;
    flex-wrap: wrap;
  }
  h2 { width:100%; text-align:center; font-size:15px; color:#2a2040; margin-bottom:2px; }
  .sub { width:100%; text-align:center; font-size:11px; color:#888; margin-bottom:16px; }
  .phone-wrap { text-align:center; }
  .lbl { font-size:10px; color:#666; margin-top:7px; }

  .phone {
    border-radius: 52px;
    border: 8px solid #1a1a1a;
    width: 210px;
    height: 460px;
    overflow: hidden;
    box-shadow: 0 10px 36px rgba(0,0,0,0.32), inset 0 0 0 1px #333;
    display: flex;
    flex-direction: column;
  }
  .di { width:64px;height:18px;background:#000;border-radius:16px;margin:8px auto 0;flex-shrink:0; }

  .topbar { display:flex;align-items:center;padding:5px 14px;gap:5px;flex-shrink:0; }
  .back   { font-size:19px;line-height:1; }
  .title  { font-size:15px;font-weight:600;flex:1; }

  .content { flex:1;display:flex;flex-direction:column;padding:2px 0 12px;overflow:hidden; }

  /* generic row */
  .row { display:flex;align-items:center;padding:7px 14px;gap:8px; }
  .lname { font-size:12px;font-weight:500;flex:1; }

  /* name input */
  .ninput { font-size:12px;border-radius:8px;padding:5px 10px;margin:0 14px 2px;width:calc(100% - 28px);box-sizing:border-box;border:none; }

  /* divider */
  .div { height:1px;margin:4px 14px;opacity:0.1; }

  /* theme row label */
  .theme-label { font-size:12px;font-weight:500;padding:7px 14px 4px; }

  /* vertical list of swatches */
  .swatches { display:flex;flex-direction:column;gap:0;padding:0 14px; }
  .sw-item  { display:flex;align-items:center;gap:8px;padding:4px 0; }
  .circle   { width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0; }
  .sw-name  { font-size:12px; }

  /* toggle */
  .tog { width:28px;height:16px;border-radius:8px;position:relative;flex-shrink:0; }
  .tog::after { content:'';position:absolute;width:12px;height:12px;background:white;border-radius:50%;top:2px;right:2px;box-shadow:0 1px 2px rgba(0,0,0,0.3); }

  .spacer { flex:1; }
  .ver { text-align:center;font-size:9px;opacity:0.25;padding-bottom:2px;flex-shrink:0; }

  /* WHITE */
  .W { background:#F8F9FF; }
  .W .topbar { border-bottom:1px solid rgba(0,0,0,0.07); }
  .W .back,.W .ck { color:#4052B5; }
  .W .title,.W .lname,.W .theme-label,.W .sw-name { color:#1B1B21; }
  .W .ninput { background:#E3E1EC;color:#1B1B21; }
  .W .div { background:#1B1B21; }
  .W .c-w { background:#F8F9FF;border:1px solid #C4BCDA; }
  .W .c-b { background:#111318; }
  .W .c-p { background:#FFD6E7;border:1px solid #F4A5C0; }
  .W .tog-on { background:#4052B5; }

  /* BLACK */
  .B { background:#111318; }
  .B .topbar { border-bottom:1px solid rgba(255,255,255,0.07); }
  .B .back,.B .ck { color:#BBC4FF; }
  .B .title,.B .lname,.B .theme-label { color:#E6E0E9; }
  .B .sw-name { color:#928F9A; }
  .B .ninput { background:#2B2930;color:#E6E0E9; }
  .B .div { background:#E6E0E9; }
  .B .c-w { background:#F8F9FF;border:1px solid #928F9A; }
  .B .c-b { background:#111318;border:1px solid #BBC4FF; }
  .B .c-p { background:#FFD6E7; }
  .B .ver { color:#E6E0E9; }

  /* PINK */
  .P { background:#FFF8F9; }
  .P .topbar { border-bottom:1px solid rgba(0,0,0,0.07); }
  .P .back,.P .ck { color:#B5346B; }
  .P .title,.P .lname,.P .theme-label,.P .sw-name { color:#22191C; }
  .P .ninput { background:#F8D7E3;color:#22191C; }
  .P .div { background:#22191C; }
  .P .c-w { background:#F8F9FF;border:1px solid #EAB8CC; }
  .P .c-b { background:#111318; }
  .P .c-p { background:#FFD6E7;border:1px solid #B5346B; }
</style>
</head>
<body>

<h2>Настройки — v4</h2>
<p class="sub">Кружки темы по вертикали</p>

<!-- WHITE -->
<div class="phone-wrap">
<div class="phone W">
  <div class="di"></div>
  <div class="topbar W"><span class="back W">‹</span><span class="title W">Настройки</span></div>
  <div class="content">

    <div class="row W"><span class="lname W">Имя</span></div>
    <input class="ninput W" value="Денис" readonly>

    <div class="div W"></div>

    <div class="theme-label W">Тема</div>
    <div class="swatches">
      <div class="sw-item"><div class="circle c-w W"><span class="ck W">✓</span></div><span class="sw-name W">Белая</span></div>
      <div class="sw-item"><div class="circle c-b W"></div><span class="sw-name W" style="color:#46464F">Чёрная</span></div>
      <div class="sw-item"><div class="circle c-p W"></div><span class="sw-name W" style="color:#46464F">Розовая</span></div>
    </div>

    <div class="div W" style="margin-top:4px"></div>

    <div class="row W">
      <span class="lname W">Уведомления</span>
      <div class="tog" style="background:#4052B5;width:28px;height:16px;border-radius:8px;position:relative;flex-shrink:0"><span style="position:absolute;width:12px;height:12px;background:white;border-radius:50%;top:2px;right:2px;box-shadow:0 1px 2px rgba(0,0,0,0.3)"></span></div>
    </div>

    <div class="spacer"></div>
    <div class="ver">v0.1.0</div>
  </div>
</div>
<p class="lbl">⚪ Белая</p>
</div>

<!-- BLACK -->
<div class="phone-wrap">
<div class="phone B">
  <div class="di"></div>
  <div class="topbar B"><span class="back B">‹</span><span class="title B">Настройки</span></div>
  <div class="content">

    <div class="row B"><span class="lname B">Имя</span></div>
    <input class="ninput B" value="Денис" readonly>

    <div class="div B"></div>

    <div class="theme-label B">Тема</div>
    <div class="swatches">
      <div class="sw-item"><div class="circle c-w B"></div><span class="sw-name B">Белая</span></div>
      <div class="sw-item"><div class="circle c-b B"><span class="ck B">✓</span></div><span class="sw-name B" style="color:#E6E0E9">Чёрная</span></div>
      <div class="sw-item"><div class="circle c-p B"></div><span class="sw-name B">Розовая</span></div>
    </div>

    <div class="div B" style="margin-top:4px"></div>

    <div class="row B">
      <span class="lname B">Уведомления</span>
      <div style="background:#BBC4FF;width:28px;height:16px;border-radius:8px;position:relative;flex-shrink:0"><span style="position:absolute;width:12px;height:12px;background:white;border-radius:50%;top:2px;right:2px;box-shadow:0 1px 2px rgba(0,0,0,0.4);display:block"></span></div>
    </div>

    <div class="spacer"></div>
    <div class="ver B">v0.1.0</div>
  </div>
</div>
<p class="lbl">⚫ Чёрная</p>
</div>

<!-- PINK -->
<div class="phone-wrap">
<div class="phone P">
  <div class="di"></div>
  <div class="topbar P"><span class="back P">‹</span><span class="title P">Настройки</span></div>
  <div class="content">

    <div class="row P"><span class="lname P">Имя</span></div>
    <input class="ninput P" value="Денис" readonly>

    <div class="div P"></div>

    <div class="theme-label P">Тема</div>
    <div class="swatches">
      <div class="sw-item"><div class="circle c-w P"></div><span class="sw-name P" style="color:#7D5260">Белая</span></div>
      <div class="sw-item"><div class="circle c-b P"></div><span class="sw-name P" style="color:#7D5260">Чёрная</span></div>
      <div class="sw-item"><div class="circle c-p P"><span class="ck P">✓</span></div><span class="sw-name P">Розовая</span></div>
    </div>

    <div class="div P" style="margin-top:4px"></div>

    <div class="row P">
      <span class="lname P">Уведомления</span>
      <div style="background:#B5346B;width:28px;height:16px;border-radius:8px;position:relative;flex-shrink:0"><span style="position:absolute;width:12px;height:12px;background:white;border-radius:50%;top:2px;right:2px;box-shadow:0 1px 2px rgba(0,0,0,0.3);display:block"></span></div>
    </div>

    <div class="spacer"></div>
    <div class="ver">v0.1.0</div>
  </div>
</div>
<p class="lbl">🩷 Розовая</p>
</div>

</body>
</html>
